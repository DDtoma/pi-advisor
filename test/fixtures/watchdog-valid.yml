# Valid full-featured config for tests
version: "1"
project: test-project

defaults:
  model: minimax-cn/MiniMax-M3
  maxTokens: 60000
  failurePolicy: backoff

advisors:
  - name: Security
    slug: security
    model: minimax-cn/MiniMax-M3:high
    focus: ["**/*.ts", "**/*.sql"]
    ignore: ["**/test/**"]
    tools: [read, grep]
    trigger:
      frequency: per-update
      priority: high
    prompt: |
      You are a security reviewer.
      Flag ONLY material issues. Cite file:line.
      Lines with # hash characters and "quotes" stay intact.
    maxTokens: 80000
    failurePolicy: halt
    enabled: true

  - name: Correctness
    slug: correctness
    trigger:
      frequency: per-N-turns
      every: 3
    prompt: |-
      Watch for weakened tests.
      No trailing newline in this prompt.
    enabled: false
